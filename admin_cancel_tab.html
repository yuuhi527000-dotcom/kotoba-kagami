<!--
==============================================
admin.html に追加する「解約申請」タブ
==============================================

① タブボタンの追加
以下を既存のタブボタン（通知タブの後）に追加：
-->

<button class="tab-btn" id="tab-cancel" onclick="switchTab('cancel')">解約申請</button>

<!--
② パネルの追加
以下を既存のパネル（panel-notifyの後）に追加：
-->

<div id="panel-cancel" class="panel">
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;align-items:center">
    <button class="btn btn-acc" onclick="loadCancelRequests()">更新</button>
    <span id="cancelCount" style="font-size:13px;color:var(--ink3);padding:6px 0"></span>
  </div>
  <div id="cancelList" style="display:flex;flex-direction:column;gap:6px">
    <div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">読み込み中...</div>
  </div>
</div>

<!--
③ JavaScriptの追加
既存の </script> タグの直前に追加：
-->

<script>
// ---- 解約申請管理 ----
async function loadCancelRequests() {
  const list = document.getElementById('cancelList');
  const countEl = document.getElementById('cancelCount');
  list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">読み込み中...</div>';

  try {
    const r = await fetch('/api/cancel', {
      headers: { 'Authorization': 'Bearer ' + ADMIN_PASS }
    });
    const items = await r.json();

    const pending = items.filter(i => i.status === 'pending');
    countEl.textContent = pending.length + '件の未対応申請';

    if (!items.length) {
      list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">解約申請はありません</div>';
      return;
    }

    list.innerHTML = items.map(item => {
      const date = new Date(item.created_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const isDone = item.status === 'done';
      return `
        <div style="background:#fff;border:0.5px solid var(--paper3);border-left:3px solid ${isDone ? '#ccc' : 'var(--acc)'};padding:.85rem 1.1rem;border-radius:2px;opacity:${isDone ? '0.6' : '1'}">
          <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.4rem">
            <span style="font-size:13px;color:var(--ink);font-weight:500">${item.email}</span>
            <span style="font-size:11px;padding:1px 8px;background:${isDone ? '#eee' : '#FFF3E0'};color:${isDone ? '#999' : '#E65100'};border-radius:2px">${isDone ? '対応済み' : '未対応'}</span>
            <span style="font-size:11px;color:var(--ink3);margin-left:auto">${date}</span>
          </div>
          ${item.reason ? `<div style="font-size:12px;color:var(--ink3);margin-bottom:.6rem">理由：${item.reason}</div>` : ''}
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            ${!isDone ? `
              <button class="btn btn-danger" onclick="handleCancel('${item.id}', '${item.email}', '${item.user_id}')">
                プレミアム解除 + 対応済みにする
              </button>
            ` : `
              <span style="font-size:12px;color:#999">対応済み</span>
            `}
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">読み込みエラー</div>';
  }
}

async function handleCancel(cancelId, email, userId) {
  if (!confirm(email + ' のプレミアムを解除して、解約申請を対応済みにしますか？')) return;

  // プレミアム解除
  await fetch('/api/admin?action=revoke', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_PASS },
    body: JSON.stringify({ id: userId }),
  });

  // 解約申請を対応済みに
  await fetch('/api/cancel', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_PASS },
    body: JSON.stringify({ id: cancelId }),
  });

  alert('対応完了しました！');
  loadCancelRequests();
}
</script>

④ switchTab関数の修正

  if (tab === 'cancel') loadCancelRequests();
