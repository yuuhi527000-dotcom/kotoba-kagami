<script src="js/search.js?v=4"></script>
<script>
  // エンターキーでの検索対応
  const inputEl = document.getElementById('search-input');
  if(inputEl) {
    inputEl.addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
  }

  // 【超重要】JSが「si」という古いIDで入力欄を探しにきても、エラーにせず自動転送する仕組み
  Object.defineProperty(document, 'getElementById', {
    value: function(id) {
      if (id === 'si') {
        return document.getElementById('search-input');
      }
      return Document.prototype.getElementById.call(this, id);
    },
    writable: true,
    configurable: true
  });

  // iPhoneの古いService Workerキャッシュを強制的に排除するスクリプト
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) {
        registration.unregister();
      }
    });
  }
</script>
