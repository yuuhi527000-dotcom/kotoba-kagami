<!--
==============================================
index.html に追加する「解約申請ボタン」
==============================================
プレミアムユーザーがログインしているときだけ表示されるボタンです。
プレミアム状態を表示している箇所の近く（有料プランボタンの近く）に追加してください。
-->

<!-- 解約申請ボタン（プレミアムユーザーのみ表示） -->
<div id="cancelSection" style="display:none; text-align:center; margin-top:12px;">
  <button
    onclick="requestCancel()"
    style="background:none; border:none; color:#999; font-size:12px; text-decoration:underline; cursor:pointer; font-family:'Zen Kaku Gothic New',sans-serif;">
    解約を申請する
  </button>
</div>

<script>
// プレミアムユーザーのときだけ解約ボタンを表示する処理
// 既存のプレミアム判定処理の後に追加してください
function showCancelButton(isPremium) {
  const section = document.getElementById('cancelSection');
  if (section) section.style.display = isPremium ? 'block' : 'none';
}

// 解約申請処理
async function requestCancel() {
  if (!confirm('解約を申請しますか？\n申請後、当日中にプレミアムを解除いたします。')) return;

  const { data: { user } } = await window._supabase.auth.getUser();
  if (!user) return alert('ログインが必要です');

  const reason = prompt('解約理由をお聞かせください（任意・スキップ可）') || '';

  try {
    const res = await fetch('/api/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: user.id, email: user.email, reason }),
    });
    const data = await res.json();
    alert('解約申請を受け付けました。当日中にご対応いたします。\nご利用ありがとうございました。');
  } catch(e) {
    alert('エラーが発生しました。メール(yuuhi527000@gmail.com)でもご連絡いただけます。');
  }
}
</script>
