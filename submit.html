<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表現を投稿する — 言葉の鏡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
<style>
  header { padding: 0 !important; flex-direction: column !important; gap: 0 !important; align-items: stretch !important; background: #fff !important; position: sticky !important; top: 0 !important; z-index: 100 !important; border-bottom: 1px solid var(--paper3) !important; width: 100% !important; display: flex !important; }
  .header-wrap { display: flex !important; align-items: center !important; justify-content: center !important; padding: .85rem 1.25rem !important; border-bottom: 1px solid var(--paper3) !important; width: 100% !important; box-sizing: border-box !important; }
  .tab-nav { display: flex !important; width: 100% !important; background: #fff !important; margin: 0 !important; padding: 0 !important; list-style: none !important; }
  .tab-nav a { flex: 1 !important; text-align: center !important; padding: 0.8rem 0 !important; font-size: 13px !important; font-weight: 500 !important; text-decoration: none !important; display: block !important; box-sizing: border-box !important; }
  .tab-nav a.tab-other { color: var(--ink2) !important; border-bottom: 1px solid var(--paper3) !important; }
  .tab-nav a.tab-submit { color: var(--acc) !important; border-bottom: 2px solid var(--acc) !important; }
</style>
<script>
// タブアクティブ（即時実行）
document.addEventListener('DOMContentLoaded', function() {
  var path = location.pathname;
  document.querySelectorAll('.tab-link, .tab-nav a').forEach(function(a) {
    a.classList.remove('active');
    var href = (a.getAttribute('href') || '').replace(/^\//, '');
    var cur = path.replace(/^\//, '') || 'index.html';
    if (href === cur || (cur === '' && href === 'index.html') ||
        (href !== '' && path.indexOf(href) !== -1)) {
      a.classList.add('active');
    }
  });
});
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2159458769076187"
     crossorigin="anonymous"></script>
</head>
<body>

<header>
  <div class="header-wrap">
    <a href="index.html" class="logo">言葉の<span>鏡</span></a>
  </div>
  <nav class="tab-nav">
    <a href="index.html" class="tab-other">トップ</a>
    <a href="ranking.html" class="tab-other">ランキング</a>
    <a href="submit.html" class="tab-submit">＋ 投稿</a>
  </nav>
</header>

<main style="padding-top: 1.5rem;">

  <!-- 投稿ページ内タブ -->
  <div style="display:flex;border-bottom:2px solid var(--paper3);max-width:500px;margin:0 auto 1.5rem;padding:0 1rem">
    <button id="tabForm" onclick="switchTab('form')" style="flex:1;padding:.65rem 0;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--acc);border-bottom:2px solid var(--acc);margin-bottom:-2px;font-family:'Zen Kaku Gothic New',sans-serif">表現を投稿</button>
    <button id="tabLatest" onclick="switchTab('latest')" style="flex:1;padding:.65rem 0;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:'Zen Kaku Gothic New',sans-serif">最新の投稿者</button>
  </div>

  <!-- 投稿フォーム -->
  <div id="panelForm" style="max-width:500px; margin:0 auto; padding:0 1rem;">
    <h1 style="font-family:'Noto Serif JP',serif; font-size:20px; font-weight:500; color:var(--ink); margin-bottom:1rem; text-align:center;">新しい言い換え表現を投稿</h1>
    <p style="font-size:12px; color:var(--ink3); text-align:center; margin-bottom:1.5rem; line-height:1.6;">
      あなたが創作活動で使っている素敵な表現や、お気に入りの語彙を教えてください。運営の承認後に反映されます。
    </p>

    <form id="submitForm" onsubmit="doSubmit(event)" style="display:flex; flex-direction:column; gap:1.25rem; background:#fff; padding:1.25rem; border:1px solid var(--paper3); border-radius:4px;">
      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">元々の言葉（例：雨、悲しい、走る） <span style="color:var(--acc);">*</span></label>
        <input type="text" id="formWord" required placeholder="検索キーワードになる言葉" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">言い換え後の言葉・表現（例：断腸の思い、氷雨） <span style="color:var(--acc);">*</span></label>
        <input type="text" id="formKana" required placeholder="核心となる単語やフレーズ" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">ジャンル <span style="color:var(--acc);">*</span></label>
        <select id="formGenre" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px; background:#fff;">
          <option value="general">汎用・その他</option>
          <option value="romance">恋愛・青春</option>
          <option value="fantasy">異世界・ファンタジー</option>
          <option value="horror">ホラー・ミステリ</option>
          <option value="historical">歴史・時代</option>
        </select>
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">シチュエーション・ニュアンス（例：失恋した時、戦闘シーンなど）</label>
        <input type="text" id="formSituation" placeholder="どんな場面に合うか" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">小説風の例文（Before → Afterの一文など） <span style="color:var(--acc);">*</span></label>
        <textarea id="formScene" required placeholder="例：氷雨がひとりぼっちの背中を濡らした。" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px; height:80px; resize:vertical; font-family:inherit;"></textarea>
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">著者名（ペンネーム）</label>
        <input type="text" id="formAuthor" placeholder="匿名" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">カクヨムのURL（任意）</label>
        <input type="url" id="formKakuyomu" placeholder="https://kakuyomu.jp/users/..." style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
        <div id="errKakuyomu" style="display:none;font-size:11px;color:#c0392b;margin-top:3px">カクヨムのURLを入力してください（kakuyomu.jp を含む）</div>
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">なろうのURL（任意）</label>
        <input type="url" id="formNarou" placeholder="https://syosetu.com/..." style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
        <div id="errNarou" style="display:none;font-size:11px;color:#c0392b;margin-top:3px">なろうのURLを入力してください（syosetu.com を含む）</div>
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">X（Twitter）のURL（任意）</label>
        <input type="url" id="formTwitter" placeholder="https://x.com/..." style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
        <div id="errTwitter" style="display:none;font-size:11px;color:#c0392b;margin-top:3px">X（Twitter）のURLを入力してください（x.com または twitter.com を含む）</div>
      </div>

      <div style="background:var(--paper);border:1px solid var(--paper3);border-radius:2px;padding:.75rem 1rem;">
        <label style="display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;font-size:12px;color:var(--ink2);line-height:1.7;">
          <input type="checkbox" id="chkOriginal" required style="accent-color:var(--acc);width:15px;height:15px;margin-top:2px;flex-shrink:0">
          <span>AIや著作物から持ってきていません。私はこの表現の権利を放棄します（CC0）。</span>
        </label>
      </div>

      <button type="submit" style="background:var(--acc); color:#fff; border:none; padding:0.8rem; border-radius:2px; font-size:14px; font-weight:500; cursor:pointer; margin-top:0.5rem;">表現を投稿する（審査へ）</button>
    </form>
  </div>

  <!-- 最新の投稿者パネル -->
  <div id="panelLatest" style="display:none;max-width:500px;margin:0 auto;padding:0 1rem">

    <!-- フィルター -->
    <div style="display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap">
      <select id="filterPeriod" onchange="loadLatest()" style="flex:1;padding:.5rem .6rem;font-size:12px;border:1px solid var(--paper3);border-radius:2px;background:#fff;color:var(--ink2);font-family:'Zen Kaku Gothic New',sans-serif">
        <option value="all">全期間</option>
        <option value="today">今日</option>
        <option value="week">今週</option>
        <option value="month">今月</option>
      </select>
      <input type="text" id="filterAuthor" placeholder="投稿者名で検索" oninput="loadLatest()" style="flex:2;min-width:0;padding:.5rem .6rem;font-size:12px;border:1px solid var(--paper3);border-radius:2px;font-family:'Zen Kaku Gothic New',sans-serif">
      <select id="filterLimit" onchange="loadLatest()" style="padding:.5rem .6rem;font-size:12px;border:1px solid var(--paper3);border-radius:2px;background:#fff;color:var(--ink2);font-family:'Zen Kaku Gothic New',sans-serif">
        <option value="10">10件</option>
        <option value="20">20件</option>
        <option value="50">50件</option>
        <option value="100">100件</option>
      </select>
    </div>

    <div id="latestList" style="display:flex;flex-direction:column;gap:8px">
      <div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">読み込み中...</div>
    </div>
  </div>

</main>

<footer style="border-top:1px solid var(--paper3);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--ink3);margin-top:2rem">
  <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem">
    <a href="index.html" style="color:var(--ink3);text-decoration:none">トップ</a>
    <a href="ranking.html" style="color:var(--ink3);text-decoration:none">ランキング</a>
    <a href="submit.html" style="color:var(--ink3);text-decoration:none">表現を投稿</a>
    <a href="privacy.html" style="color:var(--ink3);text-decoration:none">プライバシーポリシー</a>
  </div>
  <div style="margin-top:1rem">© 2025 言葉の鏡 — なろう・カクヨム作家のための言い換え表現辞典</div>
</footer>

<script src="js/const.js?v=5"></script>
<script src="js/db.js?v=5"></script>
<script src="js/ugc.js?v=5"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const p = new URLSearchParams(window.location.search);
    if(p.has('word')) document.getElementById('formWord').value = p.get('word');
  });

  function validateUrl(val, id, domains) {
    const errEl = document.getElementById('err' + id);
    if (!val) { errEl.style.display = 'none'; return true; }
    const ok = domains.some(d => val.includes(d));
    errEl.style.display = ok ? 'none' : 'block';
    return ok;
  }

  async function doSubmit(e) {
    e.preventDefault();
    if (!document.getElementById('chkOriginal').checked) {
      alert('権利放棄のチェックを入れてください。');
      return;
    }
    const kakuyomu = document.getElementById('formKakuyomu').value.trim();
    const narou    = document.getElementById('formNarou').value.trim();
    const twitter  = document.getElementById('formTwitter').value.trim();
    const v1 = validateUrl(kakuyomu, 'Kakuyomu', ['kakuyomu.jp']);
    const v2 = validateUrl(narou,    'Narou',    ['syosetu.com']);
    const v3 = validateUrl(twitter,  'Twitter',  ['twitter.com','x.com']);
    if (!v1 || !v2 || !v3) return;
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerText = '送信中...';
    try {
      await submitUGC({
        word:       document.getElementById('formWord').value,
        kana:       document.getElementById('formKana').value,
        nuance:     '',
        scene:      document.getElementById('formScene').value,
        baAfter:    '',
        genre:      document.getElementById('formGenre').value,
        situation:  document.getElementById('formSituation').value,
        authorName: document.getElementById('formAuthor').value,
        linkKakuyomu: document.getElementById('formKakuyomu').value.trim(),
        linkNarou:    document.getElementById('formNarou').value.trim(),
        linkTwitter:  document.getElementById('formTwitter').value.trim(),
      });
      alert('投稿ありがとうございました！運営の承認後に掲載されます。');
      e.target.reset();
    } catch(err) {
      alert(err.message || '投稿に失敗しました。');
    } finally {
      btn.disabled = false;
      btn.innerText = '表現を投稿する（審査へ）';
    }
  }
</script>

<script>
function switchTab(tab) {
  document.getElementById('panelForm').style.display   = tab === 'form'   ? 'block' : 'none';
  document.getElementById('panelLatest').style.display = tab === 'latest' ? 'block' : 'none';
  document.getElementById('tabForm').style.color        = tab === 'form'   ? 'var(--acc)' : 'var(--ink3)';
  document.getElementById('tabLatest').style.color      = tab === 'latest' ? 'var(--acc)' : 'var(--ink3)';
  document.getElementById('tabForm').style.borderBottomColor   = tab === 'form'   ? 'var(--acc)' : 'transparent';
  document.getElementById('tabLatest').style.borderBottomColor = tab === 'latest' ? 'var(--acc)' : 'transparent';
  if (tab === 'latest') loadLatest();
}

async function loadLatest() {
  const period = document.getElementById('filterPeriod').value;
  const author = document.getElementById('filterAuthor').value.trim();
  const limit  = document.getElementById('filterLimit').value;
  const list   = document.getElementById('latestList');
  list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">読み込み中...</div>';

  try {
    const params = new URLSearchParams({ action:'latest', limit, period });
    if (author) params.append('author', author);
    const res = await fetch('/api/ugc?' + params.toString());
    const items = res.ok ? await res.json() : [];

    if (!items.length) {
      list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">投稿がまだありません</div>';
      return;
    }

    list.innerHTML = items.map(item => {
      const gc = (typeof GENREC !== 'undefined' ? GENREC[item.genre] : '') || 'gn';
      const gl = (typeof GENRE  !== 'undefined' ? GENRE[item.genre]  : '') || item.genre || '';
      const date = item.created_at ? new Date(item.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
      const links = [
        item.link_kakuyomu ? '<a href="'+item.link_kakuyomu+'" target="_blank" rel="noopener" style="font-size:10px;padding:1px 5px;background:#E8F0F8;color:#1a3a5c;border-radius:2px;text-decoration:none;font-weight:500">K</a>' : '',
        item.link_narou    ? '<a href="'+item.link_narou+'"    target="_blank" rel="noopener" style="font-size:10px;padding:1px 5px;background:#E1F5EE;color:#085041;border-radius:2px;text-decoration:none;font-weight:500">N</a>' : '',
        item.link_twitter  ? '<a href="'+item.link_twitter+'"  target="_blank" rel="noopener" style="font-size:10px;padding:1px 5px;background:#1D9BF0;color:#fff;border-radius:2px;text-decoration:none;font-weight:500">X</a>' : '',
      ].filter(Boolean).join(' ');

      return '<div style="background:#fff;border:0.5px solid var(--paper3);border-left:3px solid var(--accl);padding:.65rem .85rem">' +
        '<div style="font-size:10px;color:var(--ink3);margin-bottom:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">' +
          '<span class="tag '+gc+'">'+(item.situation||gl)+'</span>' +
          '<span style="font-weight:500;color:var(--ink2)">'+(item.word||'')+'</span>' +
          '— '+(item.author_name||'匿名') +
          (links ? ' '+links : '') +
        '</div>' +
        '<div style="font-family:\'Noto Serif JP\',serif;font-size:13px;color:var(--ink);font-style:italic;line-height:1.7">'+(item.scene||'')+'</div>' +
        (date ? '<div style="font-size:10px;color:var(--ink3);margin-top:4px">'+date+'</div>' : '') +
      '</div>';
    }).join('');
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--ink3);font-size:13px">読み込みに失敗しました</div>';
  }
}
</script>
</body>
</html>
