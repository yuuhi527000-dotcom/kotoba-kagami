<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表現を投稿する — 言葉の鏡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header style="padding:0; flex-direction:column; gap:0; align-items:stretch; background:#fff; position:sticky; top:0; z-index:100; border-bottom:1px solid var(--paper3);">
  <div style="display:flex; align-items:center; justify-content:center; padding:.85rem 1.25rem; border-bottom:1px solid var(--paper3);">
    <a href="index.html" class="logo">言葉の<span>鏡</span></a>
  </div>
  <nav style="display:flex; width:100%; background:#fff; margin:0; padding:0;">
    <a href="index.html" class="tab-link" style="flex:1; text-align:center; padding:0.8rem 0; font-size:13px; font-weight:500; color:var(--ink2); border-bottom:1px solid var(--paper3); text-decoration:none; display:block;">トップ</a>
    <a href="ranking.html" class="tab-link" style="flex:1; text-align:center; padding:0.8rem 0; font-size:13px; font-weight:500; color:var(--ink2); border-bottom:1px solid var(--paper3); text-decoration:none; display:block;">ランキング</a>
    <a href="submit.html" class="tab-link" style="flex:1; text-align:center; padding:0.8rem 0; font-size:13px; font-weight:500; color:var(--acc); border-bottom:2px solid var(--acc); text-decoration:none; display:block;">＋ 投稿</a>
  </nav>
</header>

<main style="padding-top: 1.5rem;">
  <div style="max-width:500px; margin:0 auto; padding:0 1rem;">
    <h1 style="font-family:'Noto Serif JP',serif; font-size:20px; font-weight:500; color:var(--ink); margin-bottom:1rem; text-align:center;">新しい言い換え表現を投稿</h1>
    <p style="font-size:12px; color:var(--ink3); text-align:center; margin-bottom:1.5rem; line-height:1.6;">
      あなたが創作活動で使っている素敵な表現や、お気に入りの語彙を教えてください。運営の承認後に反映されます。
    </p>

    <form id="submitForm" onsubmit="doSubmit(event)" style="display:flex; flex-direction:column; gap:1.25rem; background:#fff; padding:1.25rem; border:1px solid var(--paper3); border-radius:4px;">
      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">元々の言葉（例：雨、悲しい、走る） <span style="color:var(--acc);">*</span></label>
        <input type="text" id="formWord" required placeholder="検索キーワードになる言葉" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">言い換え後の言葉・表現（例：断腸の思い、氷雨） <span style="color:var(--acc);">*</span></label>
        <input type="text" id="formKana" required placeholder="核心となる単語やフレーズ" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">ジャンル <span style="color:var(--acc);">*</span></label>
        <select id="formGenre" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px; background:#fff;">
          <option value="general">汎用・その他</option>
          <option value="romance">恋愛・青春</option>
          <option value="fantasy">異世界・ファンタジー</option>
          <option value="horror">ホラー・ミステリ</option>
          <option value="historical">歴史・時代</option>
        </select>
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">シチュエーション・ニュアンス（例：失恋した時、戦闘シーンなど）</label>
        <input type="text" id="formSituation" placeholder="どんな場面に合うか" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">小説風の例文（Before → Afterの一文など） <span style="color:var(--acc);">*</span></label>
        <textarea id="formScene" required placeholder="例：氷雨がひとりぼっちの背中を濡らした。" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px; height:80px; resize:vertical; font-family:inherit;"></textarea>
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:500; margin-bottom:0.4rem; color:var(--ink2);">著者名（ペンネーム）</label>
        <input type="text" id="formAuthor" placeholder="匿名" style="width:100%; padding:0.6rem; border:1px solid var(--paper3); border-radius:2px; font-size:14px;" autocomplete="off">
      </div>

      <button type="submit" style="background:var(--acc); color:#fff; border:none; padding:0.8rem; border-radius:2px; font-size:14px; font-weight:500; cursor:pointer; margin-top:0.5rem;">表現を投稿する（審査へ）</button>
    </form>
  </div>
</main>

<footer style="border-top:1px solid var(--paper3);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--ink3);margin-top:2rem">
  <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem">
    <a href="index.html" style="color:var(--ink3);text-decoration:none">トップ</a>
    <a href="ranking.html" style="color:var(--ink3);text-decoration:none">ランキング</a>
    <a href="submit.html" style="color:var(--ink3);text-decoration:none">表現を投稿</a>
    <a href="privacy.html" style="color:var(--ink3);text-decoration:none">プライバシーポリシー</a>
  </div>
  <div style="margin-top:1rem">© 2025 言葉の鏡 — なろう・カクヨム作家のための言い換え表現辞典</div>
</footer>

<script src="js/const.js"></script>
<script src="js/db.js"></script>
<script src="js/ugc.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(window.location.search);
    if(p.has('word')) document.getElementById('formWord').value = p.get('word');
  });

  async function doSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerText = '送信中...';
    
    try {
      await submitUGC({
        word:       document.getElementById('formWord').value,
        kana:       document.getElementById('formKana').value,
        nuance:     '',
        scene:      document.getElementById('formScene').value,
        baAfter:    '',
        genre:      document.getElementById('formGenre').value,
        situation:  document.getElementById('formSituation').value,
        authorName: document.getElementById('formAuthor').value
      });
      alert('投稿ありがとうございました！運営の承認後に掲載されます。');
      e.target.reset();
    } catch(err) {
      alert(err.message || '投稿に失敗しました。');
    } finally {
      btn.disabled = false;
      btn.innerText = '表現を投稿する（審査へ）';
    }
  }
</script>
</body>
</html>
