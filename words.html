<script>
const KANA_MAP = {
  雨:'あめ',夜:'よる',風:'かぜ',雪:'ゆき',闇:'やみ',光:'ひかり',
  悲しい:'かなしい',嬉しい:'うれしい',切ない:'せつない',寂しい:'さびしい',
  苦しい:'くるしい',恥ずかしい:'はずかしい',孤独:'こどく',怒り:'いかり',
  恐怖:'きょうふ',沈黙:'ちんもく',走る:'はしる',泣く:'なく',笑う:'わらう',叫ぶ:'さけぶ',
  明るい:'あかるい',憧れる:'あこがれる',焦る:'あせる',温かい:'あたたかい',歩く:'あるく',
  輝く:'かがやく',消える:'きえる',嫌い:'きらい',苦しむ:'くるしむ',恋しい:'こいしい',
  怖い:'こわい',静か:'しずか',好き:'すき',逃げる:'にげる',眠る:'ねむる',
  憎い:'にくい',儚い:'はかない',離れる:'はなれる',光る:'ひかる',一人:'ひとり',
  震える:'ふるえる',迷う:'まよう',見つめる:'みつめる',守る:'まもる',燃える:'もえる',揺れる:'ゆれる',
};
const SLUG_MAP = {
  雨:'ame',夜:'yoru',風:'kaze',雪:'yuki',闇:'yami',光:'hikari',
  悲しい:'kanashii',嬉しい:'ureshii',切ない:'setsunai',寂しい:'sabishii',
  苦しい:'kurushii',恥ずかしい:'hazukashii',孤独:'kodoku',怒り:'ikari',
  恐怖:'kyoufu',沈黙:'chinmoku',走る:'hashiru',泣く:'naku',笑う:'warau',叫ぶ:'sakebu',
};

function getCategory(word) {
  const nature = ['雨','夜','風','雪','闇','光'];
  const action = ['走る','泣く','笑う','叫ぶ','歩く','逃げる','眠る','消える','光る','震える','見つめる','守る','燃える','揺れる','離れる'];
  if (nature.includes(word)) return 'nature';
  if (action.includes(word)) return 'action';
  return 'emotion';
}

function renderGrid(gridId, words) {
  const grid = document.getElementById(gridId);
  if (!words.length) { grid.innerHTML = '<p style="font-size:13px;color:var(--ink3)">準備中</p>'; return; }
  grid.innerHTML = words.map(w => {
    return `<a class="word-item" href="/index.html" onclick="sessionStorage.setItem('autoSearch','${w.word}')">
      <div class="wi-word">${w.word}</div>
      <div class="wi-kana">${w.kana || KANA_MAP[w.word] || ''}</div>
    </a>`;
  }).join('');
}

async function loadWords() {
  let allWords = [];
  // Supabaseから取得を試みる
  try {
    const res = await fetch('/api/words?action=list');
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) allWords = data;
  } catch(e) {}

  // なければdb.jsから
  if (allWords.length === 0) {
    allWords = Object.keys(DB).map(word => ({
      word, kana: KANA_MAP[word] || '', category: getCategory(word)
    }));
  }

  allWords.sort((a,b) => (a.kana||'').localeCompare(b.kana||'', 'ja'));

  const nature  = allWords.filter(w => w.category === 'nature');
  const emotion = allWords.filter(w => w.category === 'emotion' || !['nature','action'].includes(w.category));
  const action  = allWords.filter(w => w.category === 'action');

  renderGrid('grid-nature', nature);
  renderGrid('grid-emotion', emotion);
  renderGrid('grid-action', action);
  document.getElementById('totalCount').textContent = allWords.length;
}

loadWords();
</script>
