<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>よく使われる言い換え表現 TOP10 — 言葉の鏡</title>
<meta name="description" content="なろう・カクヨム作家に人気の言い換え表現TOP10。悲しい・雨・走るなど人気語録をランキング形式で紹介。例文付き。">
<meta property="og:title" content="よく使われる言い換え表現 TOP10 — 言葉の鏡">
<meta property="og:type" content="website">
<meta property="og:site_name" content="言葉の鏡">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8b4513">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.rank-wrap{max-width:720px;margin:0 auto;padding:0 1.25rem 4rem}
.rank-hero{padding:2rem 0 1.5rem;text-align:center}
.rank-hero h1{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:500;margin-bottom:.5rem}
.rank-hero p{font-size:13px;color:var(--ink3)}
.rank-item{display:flex;align-items:center;gap:1rem;background:#fff;border:0.5px solid var(--paper3);padding:1rem 1.25rem;margin-bottom:8px;cursor:pointer;transition:border-color .15s;text-decoration:none}
.rank-item:hover{border-color:var(--acc)}
.rank-num{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:300;color:var(--paper3);min-width:36px;text-align:center}
.rank-num.top3{color:var(--acc);font-weight:500}
.rank-body{flex:1;min-width:0}
.rank-word{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:500;color:var(--ink);margin-bottom:3px}
.rank-ex{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-bar-wrap{width:80px;flex-shrink:0}
.rank-bar{height:4px;background:var(--paper3);border-radius:2px;overflow:hidden}
.rank-fill{height:100%;background:var(--acc);border-radius:2px}
.rank-count{font-size:10px;color:var(--ink3);text-align:right;margin-top:2px}
</style>
</head>
<body>
<header style="padding:0;flex-direction:column;gap:0;align-items:stretch">
  <div style="display:flex;align-items:center;justify-content:center;padding:.65rem 1.25rem;border-bottom:1px solid var(--paper3)">
    <a href="/index.html" class="logo">言葉の<span>鏡</span></a>
  </div>
  <nav style="display:flex;align-items:center;border-bottom:1px solid var(--paper3);background:#fff">
    <a href="/index.html" class="tab-link">トップ</a>
    <a href="/ranking.html" class="tab-link">ランキング</a>
    <a href="/submit.html" class="tab-link">＋ 投稿</a>
  </nav>
</header>

<div class="rank-wrap">
  <div class="rank-hero">
    <h1>よく使われる言い換え表現 TOP10</h1>
    <p>なろう・カクヨム作家に人気の言い換え表現ランキング</p>
  </div>

  <div id="rankList"></div>

  <div style="text-align:center;margin-top:2rem">
    <a href="words.html" style="font-size:13px;color:var(--acc);text-decoration:none;border-bottom:1px solid var(--acc);padding-bottom:1px">
    </a>
  </div>
</div>

<footer style="border-top:1px solid var(--paper3);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--ink3)">
  <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem">
    <a href="index.html" style="color:var(--ink3);text-decoration:none">トップ</a>
    <a href="ranking.html" style="color:var(--ink3);text-decoration:none">ランキング</a>
    <a href="submit.html" style="color:var(--ink3);text-decoration:none">表現を投稿</a>
    <a href="privacy.html" style="color:var(--ink3);text-decoration:none">プライバシーポリシー</a>
  </div>
  <div>© 2025 言葉の鏡 — なろう・カクヨム作家のための言い換え表現辞典</div>
</footer>

<script src="js/const.js"></script>
<script src="js/db.js"></script>
<script>
// ランキングデータ（Google Analyticsが育ったら実データに差し替え）
const RANKING = [
  { word:'悲しい', count:100, ex:'断腸の思いで唇をかんだ' },
  { word:'雨',     count:94,  ex:'氷雨がひとりぼっちの背中を濡らした' },
  { word:'走る',   count:88,  ex:'疾風のように姿を消した' },
  { word:'怒り',   count:82,  ex:'怒髪天を衝く勢いで立ち上がった' },
  { word:'切ない', count:76,  ex:'胸が締め付けられて、視線を逸らすしかなかった' },
  { word:'夜',     count:71,  ex:'夜の帳が下りる頃、街は別の顔を見せた' },
  { word:'恐怖',   count:65,  ex:'戦慄が背筋を走り、足が動かなくなった' },
  { word:'泣く',   count:59,  ex:'嗚咽を堪えながら、それでも彼女は笑おうとした' },
  { word:'孤独',   count:54,  ex:'天涯孤独ゆえに、失うものが何もなかった' },
  { word:'闇',     count:48,  ex:'彼の背中が、静かに闇に溶けていった' },
];

const slug_map = {
  悲しい:'kanashii',雨:'ame',走る:'hashiru',怒り:'ikari',切ない:'setsunai',
  夜:'yoru',恐怖:'kyoufu',泣く:'naku',孤独:'kodoku',闇:'yami',
};

const max = RANKING[0].count;
const list = document.getElementById('rankList');
list.innerHTML = RANKING.map((item, i) => {
  const pct = Math.round(item.count / max * 100);
  const slug = slug_map[item.word];
  const href = slug ? `word/${slug}.html` : `index.html`;
  return `
    <a class="rank-item" href="${href}">
      <div class="rank-num ${i<3?'top3':''}">${i+1}</div>
      <div class="rank-body">
        <div class="rank-word">${item.word}</div>
        <div class="rank-ex">例）${item.ex}</div>
      </div>
      <div class="rank-bar-wrap">
        <div class="rank-bar"><div class="rank-fill" style="width:${pct}%"></div></div>
        <div class="rank-count">人気度 ${pct}%</div>
      </div>
    </a>`;
}).join('');
</script>
</body>
</html>
