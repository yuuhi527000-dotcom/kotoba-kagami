<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注目ランキング — 言葉の鏡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
  header { padding: 0 !important; flex-direction: column !important; gap: 0 !important; align-items: stretch !important; background: #fff !important; position: sticky !important; top: 0 !important; z-index: 100 !important; border-bottom: 1px solid var(--paper3) !important; }
  header div:first-child { display: flex !important; align-items: center !important; justify-content: center !important; padding: .85rem 1.25rem !important; border-bottom: 1px solid var(--paper3) !important; width: 100% !important; box-sizing: border-box !important; }
  header nav { display: flex !important; width: 100% !important; background: #fff !important; margin: 0 !important; padding: 0 !important; }
  header nav a { flex: 1 !important; text-align: center !important; padding: 0.8rem 0 !important; font-size: 13px !important; font-weight: 500 !important; text-decoration: none !important; display: block !important; box-sizing: border-box !important; }
  
  /* ランキングページ用のタブ色アクティブ設定 */
  header nav a:nth-child(1) { color: var(--ink2) !important; border-bottom: 1px solid var(--paper3) !important; }
  header nav a:nth-child(2) { color: var(--acc) !important; border-bottom: 2px solid var(--acc) !important; }
  header nav a:nth-child(3) { color: var(--ink2) !important; border-bottom: 1px solid var(--paper3) !important; }
</style>
</head>
<body>

<header>
  <div>
    <a href="index.html" class="logo">言葉の<span>鏡</span></a>
  </div>
  <nav>
    <a href="index.html">トップ</a>
    <a href="ranking.html">ランキング</a>
    <a href="submit.html">＋ 投稿</a>
  </nav>
</header>

<main style="padding-top: 1.5rem;">
  <div style="max-width:600px; margin:0 auto; padding:0 1rem;">
    <h1 style="font-family:'Noto Serif JP',serif; font-size:20px; font-weight:500; color:var(--ink); margin-bottom:1.5rem; text-align:center;">注目度の高い表現</h1>
    <div id="rankingArea"></div>
  </div>
</main>

<footer style="border-top:1px solid var(--paper3);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--ink3);margin-top:4px">
  <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem">
    <a href="index.html" style="color:var(--ink3);text-decoration:none">トップ</a>
    <a href="ranking.html" style="color:var(--ink3);text-decoration:none">ランキング</a>
    <a href="submit.html" style="color:var(--ink3);text-decoration:none">表現を投稿</a>
    <a href="privacy.html" style="color:var(--ink3);text-decoration:none">プライバシーポリシー</a>
  </div>
  <div style="margin-top:1rem">© 2025 言葉の鏡 — なろう・カクヨム作家のための言い換え表現辞典</div>
</footer>

<script src="js/const.js"></script>
<script src="js/db.js"></script>
<script src="js/ugc.js"></script>
<script>
  async function loadRanking() {
    const area = document.getElementById('rankingArea');
    if(!area) return;
    area.innerHTML = '<div class="loading" style="display:block;"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div style="margin-top:.6rem;font-size:12px;color:var(--ink3)">ランキングを抽出中</div></div>';
    try {
      const res = await fetch('/api/ugc?action=popular');
      const items = res.ok ? await res.json() : [];
      if(items.length === 0) {
        area.innerHTML = '<p style="text-align:center;color:var(--ink3);font-size:13px;padding:2rem">現在ランキングデータはありません。</p>';
        return;
      }
      let html = '<div style="display:flex;flex-direction:column;gap:1rem;">';
      items.forEach((item, idx) => {
        const gc = GENREC[item.genre] || 'gn';
        const gl = GENRE[item.genre] || '';
        html += `
          <div class="ugc-card" style="position:relative; padding:1.25rem; background:#fff; border:1px solid var(--paper3); border-radius:4px;">
            <div style="position:absolute;top:12px;right:15px;font-size:20px;font-weight:700;color:var(--acc);font-style:italic;opacity:0.4;">Rank ${idx+1}</div>
            <div class="ugc-word" style="font-size:16px;font-weight:bold;color:var(--ink);">${item.word}<span style="font-size:11px;color:var(--ink3);margin-left:.5rem;font-weight:normal;">${item.kana||''}</span></div>
            <div class="ugc-meta" style="margin:0.4rem 0 0.6rem;"><span class="tag ${gc}">${item.situation || gl}</span><span style="margin-left:.5rem;font-size:11px;color:var(--ink3)">— ${item.author_name||'匿名'}</span></div>
            <div class="ugc-scene" style="color:var(--ink2);line-height:1.6;font-size:14px;">${item.scene}</div>
            ${item.ba_after ? `<div style="margin-top:8px;font-size:13px;color:var(--ink3)">→ <span style="font-family:'Noto Serif JP',serif;color:var(--ink);font-weight:500;">${item.ba_after}</span></div>` : ''}
          </div>`;
      });
      html += '</div>';
      area.innerHTML = html;
    } catch(e) {
      area.innerHTML = '<p style="text-align:center;color:var(--ink3);font-size:13px;padding:2rem">データの読み込みに失敗しました。</p>';
    }
  }
  document.addEventListener('DOMContentLoaded', loadRanking);
</script>
</body>
</html>
