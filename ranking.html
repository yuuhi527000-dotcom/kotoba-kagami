  .header-wrap { display: flex !important; align-items: center !important; justify-content: center !important; padding: .85rem 1.25rem !important; border-bottom: 1px solid var(--paper3) !important; width: 100% !important; box-sizing: border-box !important; }
  .tab-nav { display: flex !important; width: 100% !important; background: #fff !important; margin: 0 !important; padding: 0 !important; list-style: none !important; }

  .rank-fill { height:100%;background:var(--acc);border-radius:2px; }
</style>
<script>
// タブアクティブ（即時実行）
document.addEventListener('DOMContentLoaded', function() {
  var path = location.pathname;
  document.querySelectorAll('.tab-link, .tab-nav a').forEach(function(a) {
    a.classList.remove('active');
    var href = (a.getAttribute('href') || '').replace(/^\//, '');
    var cur = path.replace(/^\//, '') || 'index.html';
    if (href === cur || (cur === '' && href === 'index.html') ||
        (href !== '' && path.indexOf(href) !== -1)) {
      a.classList.add('active');
    }
  });
});
</script>

<script>

// 仮ランキングデータ（Google Analyticsが育ったら実データに差し替え）
const FALLBACK = [
  { word:'悲しい', genre:'romance', ex:'断腸の思いで唇をかんだ', pct:100 },
  { word:'雨',     genre:'general', ex:'氷雨がひとりぼっちの背中を濡らした', pct:94 },
  { word:'走る',   genre:'fantasy', ex:'疾風のように姿を消した', pct:88 },
  { word:'怒り',   genre:'horror',  ex:'怒髪天を衝く勢いで立ち上がった', pct:82 },
  { word:'切ない', genre:'romance', ex:'胸が締め付けられて、視線を逸らすしかなかった', pct:76 },
];

async function loadRanking() {
  const area = document.getElementById('rankingArea');
  let items = [];
  try {
    const res = await fetch('/api/ranking');
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) items = data;
    }
  } catch(e) {}
  if (items.length === 0) {
    renderFallback(area);
    return;
  }
  let html = '<div style="display:flex;flex-direction:column;gap:8px;">';
  const maxCount = items[0].search_count || 1;
  items.slice(0,10).forEach((item, idx) => {
    const pct = Math.round((item.search_count / maxCount) * 100);
    const gc = (typeof GENREC !== 'undefined' ? GENREC[item.genre] : '') || 'gn';
    const gl = (typeof GENRE !== 'undefined' ? GENRE[item.genre] : '') || item.genre || '';
    html += `
      <a class="rank-card" href="index.html" onclick="sessionStorage.setItem('autoSearch','${item.word}')">
        <div class="rank-num ${idx<3?'top':''}">${idx+1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Noto Serif JP',serif;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:4px;">${item.word}</div>
          ${item.example ? `<div style="font-size:12px;color:var(--ink2);font-family:'Noto Serif JP',serif;margin-bottom:4px;line-height:1.6;">${item.example}</div>` : ''}
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="tag ${gc}" style="font-size:10px;">${gl}</span>
            <span style="font-size:11px;color:var(--ink3);">検索 ${item.search_count}回</span>
          </div>
          <div class="rank-bar" style="margin-top:4px;"><div class="rank-fill" style="width:${pct}%;"></div></div>
        </div>
      </a>`;
  });
  html += '</div>';
  html += '<p style="text-align:center;font-size:12px;color:var(--ink3);margin-top:1.5rem;line-height:1.8;">なろう・カクヨム作家向けの言い換え表現辞典<br>無料登録で1日3回まで検索できます</p>';
  area.innerHTML = html;
}

function renderFallback(area) {
  let html = '<div style="display:flex;flex-direction:column;gap:8px;">';
  FALLBACK.forEach((item, idx) => {
    const gc = GENREC[item.genre] || 'gn';
    html += `
      <a class="rank-card" href="index.html" onclick="sessionStorage.setItem('autoSearch','${item.word}')">
        <div class="rank-num ${idx<3?'top':''}">${idx+1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Noto Serif JP',serif;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:2px;">${item.word}</div>
          <div style="font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">例）${item.ex}</div>
          <div class="rank-bar"><div class="rank-fill" style="width:${item.pct}%;"></div></div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <span class="tag ${gc}">${GENRE[item.genre]||item.genre}</span>
        </div>
      </a>`;
  });
  html += '</div>';
  html += '<p style="text-align:center;font-size:11px;color:var(--paper3);margin-top:1rem;">※ 現在は仮データを表示しています</p>';
  area.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', loadRanking);
</script>
