<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注目ランキング — 言葉の鏡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header style="padding:0; flex-direction:column; gap:0; align-items:stretch; background:#fff; position:sticky; top:0; z-index:100; border-bottom:1px solid var(--paper3);">
  <div style="display:flex; align-items:center; justify-content:center; padding:.85rem 1.25rem; border-bottom:1px solid var(--paper3);">
    <a href="/index.html" class="logo">言葉の<span>鏡</span></a>
  </div>
  <nav style="display:flex; width:100%; background:#fff; margin:0; padding:0;">
    <a href="/index.html" class="tab-link" style="flex:1; text-align:center; padding:0.8rem 0; font-size:13px; font-weight:500; color:var(--ink2); border-bottom:1px solid var(--paper3); text-decoration:none; display:block;">トップ</a>
    <a href="/ranking.html" class="tab-link" style="flex:1; text-align:center; padding:0.8rem 0; font-size:13px; font-weight:500; color:var(--acc); border-bottom:2px solid var(--acc); text-decoration:none; display:block;">ランキング</a>
    <a href="/submit.html" class="tab-link" style="flex:1; text-align:center; padding:0.8rem 0; font-size:13px; font-weight:500; color:var(--ink2); border-bottom:1px solid var(--paper3); text-decoration:none; display:block;">＋ 投稿</a>
  </nav>
</header>

<main style="padding-top: 1.5rem;">
  <div style="max-width:600px; margin:0 auto; padding:0 1rem;">
    <h1 style="font-family:'Noto Serif JP',serif; font-size:20px; font-weight:500; color:var(--ink); margin-bottom:1.5rem; text-align:center;">注目度の高い表現</h1>
    <div id="rankingArea">
      </div>
  </div>
</main>

<footer style="border-top:1px solid var(--paper3);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--ink3);margin-top:4px">
  <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem">
    <a href="index.html" style="color:var(--ink3);text-decoration:none">トップ</a>
    <a href="ranking.html" style="color:var(--ink3);text-decoration:none">ランキング</a>
    <a href="submit.html" style="color:var(--ink3);text-decoration:none">表現を投稿</a>
    <a href="privacy.html" style="color:var(--ink3);text-decoration:none">プライバシーポリシー</a>
  </div>
  <div style="margin-top:1rem">© 2025 言葉の鏡 — なろう・カクヨム作家のための言い換え表現辞典</div>
</footer>

<script src="js/const.js"></script>
<script src="js/db.js"></script>
<script src="js/ugc.js"></script>
<script>
  // ランキング画面用の簡易ダミーまたはAPI読み込み処理
  async function loadRanking() {
    const area = document.getElementById('rankingArea');
    if(!area) return;
    area.innerHTML = '<p style="text-align:center;color:var(--ink3);font-size:13px;padding:2rem">データを読み込み中...</p>';
    try {
      const res = await fetch('/api/ugc?action=popular');
      const items = res.ok ? await res.json() : [];
      if(items.length === 0) {
        area.innerHTML = '<p style="text-align:center;color:var(--ink3);font-size:13px;padding:2rem">現在ランキングデータはありません。</p>';
        return;
      }
      let html = '<div class="ugc-grid" style="display:flex;flex-direction:column;gap:1rem;">';
      items.forEach((item, idx) => {
        const gc = GENREC[item.genre] || 'gn';
        const gl = GENRE[item.genre] || '';
        html += `
          <div class="ugc-card" style="position:relative;">
            <div style="position:absolute;top:10px;right:15px;font-size:18px;font-weight:bold;color:var(--acc);opacity:0.3;">#${idx+1}</div>
            <div class="ugc-word" style="font-size:16px;font-weight:bold;">${item.word}</div>
            <div class="ugc-meta" style="margin:0.25rem 0 0.5rem;"><span class="tag ${gc}">${item.situation || gl}</span></div>
            <div class="ugc-scene" style="font-style:italic;color:var(--ink2);">${item.scene}</div>
            ${item.ba_after ? `<div class="ugc-after" style="margin-top:6px;color:var(--ink);font-weight:500;">→ ${item.ba_after}</div>` : ''}
          </div>`;
      });
      html += '</div>';
      area.innerHTML = html;
    } catch(e) {
      area.innerHTML = '<p style="text-align:center;color:var(--ink3);font-size:13px;padding:2rem">読み込み中にエラーが発生しました。</p>';
    }
  }
  document.addEventListener('DOMContentLoaded', loadRanking);
</script>
</body>
</html>
