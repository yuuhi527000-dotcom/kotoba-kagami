  <h1>「夜」の言い換え表現</h1>
  <p>
    小説・ライトノベルで使える「夜（よる）」の言い換え表現を、<br>
    恋愛・異世界・ホラー・歴史などジャンル別に紹介します。<br>
    ビフォー→アフター例文付きで、すぐに執筆に活用できます。
  </p>
</div>

  <div class="cta-box">
    <span class="cta-text">ジャンル別にさらに多くの表現を検索できます</span>
    <a href="../index.html?q=yoru" class="cta-btn" onclick="sessionStorage.setItem('autoSearch','夜')">
      「夜」を検索する →

    <div class="loading show">

<footer style="border-top:1px solid var(--paper3);padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--ink3)">
  <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem">
    <a href="../index.html"   style="color:var(--ink3);text-decoration:none">トップ</a>
    <a href="../words.html"   style="color:var(--ink3);text-decoration:none">語録一覧</a>
    <a href="../submit.html"  style="color:var(--ink3);text-decoration:none">表現を投稿</a>
    <a href="../privacy.html" style="color:var(--ink3);text-decoration:none">プライバシーポリシー</a>
  </div>

</footer>

<script src="../js/const.js"></script>
<script src="../js/db.js"></script>
<script>
const WORD = '夜';

window.addEventListener('load', () => {
  const data = DB[WORD];
  if (!data) {
    document.getElementById('resultArea').innerHTML = '<p style="color:var(--ink3);font-size:14px">データを読み込み中...</p>';
    return;
  }
  renderWordPage(WORD, data);
});

function renderWordPage(word, data) {
  const bas = data.beforeafter || [];
  const syns = data.synonyms || [];
  const exprs = data.expressions || [];

  let h = '';

  // ビフォーアフター（全件・ジャンル別に色分け）
  if (bas.length) {
    h += `<div class="sh">ビフォー → アフター 例文集（${bas.length}件）</div><div class="ba-section"><div class="ba-grid">`;
    bas.forEach(b => {
      const gc = GENREC[b.genre] || 'gn';
      h += `<div class="ba-card">
        <div class="ba-head">
          <span class="sit-tag tag ${gc}">${b.sit||''}</span>
          <button class="ba-copy" onclick="navigator.clipboard.writeText('${b.after.replace(/'/g,\"'\")}').then(()=>{this.textContent='コピー済み✓';setTimeout(()=>this.textContent='コピー',1500)})">コピー</button>
        </div>
        <div class="ba-body">
          <div class="ba-b">${b.before}</div>
          <div class="ba-arrow">→</div>
          <div class="ba-a">${b.after}</div>
        </div>
        ${b.note ? `<div class="ba-note">${b.note}</div>` : ''}
      </div>`;
    });
    h += `</div></div>`;
  }

  // 情景表現
  if (exprs.length) {
    h += `<div class="sh">情景表現フレーズ</div><div class="expr-list">`;
    exprs.forEach(e => { h += `<div class="expr">${e}</div>`; });
    h += `</div>`;
  }

  // ニュアンスカード
  if (syns.length) {
    h += `<div class="sh">ニュアンス比較カード</div><div class="nc-grid">`;
    syns.forEach(s => {
      const gt = (s.genres||[]).slice(0,2).map(g=>`<span class="tag ${GENREC[g]||'gn'}">${GENRE[g]||g}</span>`).join('');
      const uc = (s.usecases||[]).map(u=>`<span class="uc">📌 ${u}</span>`).join(' ');
      h += `<div class="nc">
        <div class="nc-w">${s.word}</div><div class="nc-k">${s.kana}</div>
        <div class="brow"><span class="blabel">強度</span><div class="bbar"><div class="bfill" style="width:${s.intensity||50}%"></div></div></div>
        <div class="brow"><span class="blabel">詩的さ</span><div class="bbar"><div class="bfill" style="width:${s.lyricism||50}%"></div></div></div>
        <div class="nc-n">${s.nuance}</div>
        <div class="tags"><span class="tag ${TONEC[s.tone]||'tm'}">${TONE[s.tone]||s.tone}</span>${gt}</div>
        ${uc ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:3px">${uc}</div>` : ''}
      </div>`;
    });
    h += `</div>`;
  }

  // 関連語リンク
  const allWords = Object.keys(DB).filter(w => w !== word);
  h += `<div class="sh" style="margin-top:2rem">他の語録を見る</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:2rem">`;
  allWords.forEach(w => {
    h += `<a href="${w === '雨' ? 'ame' : w === '夜' ? 'yoru' : w === '風' ? 'kaze' : w === '雪' ? 'yuki' : w === '闇' ? 'yami' : w === '光' ? 'hikari' : w === '悲しい' ? 'kanashii' : w === '嬉しい' ? 'ureshii' : w === '切ない' ? 'setsunai' : w === '寂しい' ? 'sabishii' : w === '苦しい' ? 'kurushii' : w === '恥ずかしい' ? 'hazukashii' : w === '孤独' ? 'kodoku' : w === '怒り' ? 'ikari' : w === '恐怖' ? 'kyoufu' : w === '沈黙' ? 'chinmoku' : w === '走る' ? 'hashiru' : w === '泣く' ? 'naku' : w === '笑う' ? 'warau' : 'sakebu'}.html" style="font-family:'Noto Serif JP',serif;font-size:14px;color:var(--ink2);padding:5px 12px;border:1px solid var(--paper3);border-radius:2px;text-decoration:none;background:#fff;transition:all .15s" onmouseover="this.style.borderColor='var(--acc)';this.style.color='var(--acc)'" onmouseout="this.style.borderColor='var(--paper3)';this.style.color='var(--ink2)'">${w}</a>`;
  });
  h += `</div>`;

  document.getElementById('resultArea').innerHTML = h;
}
</script>
</body>
