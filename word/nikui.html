<script>
const WORD = '憎い';
const SLUG = 'nikui';

window.addEventListener('load', async () => {
  const data = DB[WORD];
  if (data) {
    renderWordPage(WORD, data);
  } else {
    await fetchAndRender(WORD);
  }
});

async function fetchAndRender(word) {
  try {
    const res = await fetch('../api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        max_tokens: 2000,
        messages: [{role:'user', content:`小説・ラノベ作家向け。「${word}」の言い換えをJSONのみ返却:
{"synonyms":[{"word":"語","kana":"読み","nuance":"20字","tone":"modern","genres":["general"],"intensity":50,"lyricism":50,"usecases":["シーン"],"desc":"40字","scene":"40字"}],"expressions":["表現1","表現2","表現3"],"beforeafter":[{"sit":"恋愛・失恋","genre":"romance","before":"平凡","after":"豊か","note":"20字"},{"sit":"異世界・幕開け","genre":"fantasy","before":"平凡","after":"豊か","note":"20字"},{"sit":"ホラー・緊迫","genre":"horror","before":"平凡","after":"豊か","note":"20字"},{"sit":"歴史・冒頭","genre":"historical","before":"平凡","after":"豊か","note":"20字"},{"sit":"汎用","genre":"general","before":"平凡","after":"豊か","note":"20字"}]}`}]
      })
    });
    const j = await res.json();
    const raw = j.content.map(c=>c.text||'').join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
    renderWordPage(word, parsed);
  } catch(e) {
    document.getElementById('resultArea').innerHTML = `
      <p style="color:var(--ink3);font-size:14px;padding:1rem 0">
        表現の生成に失敗しました。
        <a href="../index.html" onclick="sessionStorage.setItem('autoSearch','${word}')" style="color:var(--acc)">
          検索ページで試す →
        </a>
      </p>`;
  }
}

function renderWordPage(word, data) {
  const bas  = data.beforeafter || [];
  const syns = data.synonyms || [];
  const exprs= data.expressions || [];
  let h = '';

  if (bas.length) {
    h += `<div class="sh">ビフォー → アフター 例文集(${bas.length}件)</div><div class="ba-section"><div class="ba-grid">`;
    bas.forEach(b => {
      const gc = GENREC[b.genre]||'gn';
      h += `<div class="ba-card">
        <div class="ba-head"><span class="sit-tag tag ${gc}">${b.sit||''}</span>
          <button class="ba-copy" onclick="navigator.clipboard.writeText(this.closest('.ba-card').querySelector('.ba-a').textContent).then(()=>{this.textContent='✓';setTimeout(()=>this.textContent='コピー',1500)})">コピー</button>
        </div>
        <div class="ba-body">
          <div class="ba-b">${b.before}</div>
          <div class="ba-arrow">→</div>
          <div class="ba-a">${b.after}</div>
        </div>
        ${b.note?`<div class="ba-note">${b.note}</div>`:''}
      </div>`;
    });
    h += `</div></div>`;
  }

  if (exprs.length) {
    h += `<div class="sh">情景表現フレーズ</div><div class="expr-list">`;
    exprs.forEach(e=>{ h+=`<div class="expr">${e}</div>`; });
    h += `</div>`;
  }

  if (syns.length) {
    h += `<div class="sh">ニュアンス比較カード</div><div class="nc-grid">`;
    syns.forEach(s=>{
      const gt=(s.genres||[]).slice(0,2).map(g=>`<span class="tag ${GENREC[g]||'gn'}">${GENRE[g]||g}</span>`).join('');
      const uc=(s.usecases||[]).map(u=>`<span class="uc">📌 ${u}</span>`).join(' ');
      h+=`<div class="nc">
        <div class="nc-w">${s.word}</div><div class="nc-k">${s.kana}</div>
        <div class="brow"><span class="blabel">強度</span><div class="bbar"><div class="bfill" style="width:${s.intensity||50}%"></div></div></div>
        <div class="brow"><span class="blabel">詩的さ</span><div class="bbar"><div class="bfill" style="width:${s.lyricism||50}%"></div></div></div>
        <div class="nc-n">${s.nuance}</div>
        <div class="tags"><span class="tag ${TONEC[s.tone]||'tm'}">${TONE[s.tone]||s.tone}</span>${gt}</div>
        ${uc?`<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:3px">${uc}</div>`:''}
      </div>`;
    });
    h += `</div>`;
  }

  document.getElementById('resultArea').innerHTML = h;
}
</script>
